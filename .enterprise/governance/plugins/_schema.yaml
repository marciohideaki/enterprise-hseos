# JSON Schema for canonical plugin manifests (.enterprise/governance/plugins/definitions/<id>/plugin.yaml)
# Validated by the compiler before emitting plugin marketplace artifacts.
# See ADR-0009 for design rationale.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://hseos.dev/schemas/plugin-manifest.schema.yaml"
title: "HSEOS Plugin Manifest"
description: |
  Declarative spec for a plugin. Each .enterprise/governance/plugins/definitions/<id>/plugin.yaml
  conforms to this schema. The compiler validates conformance, preserves the
  optional `extends` provenance reference as metadata, and emits both vendor formats
  (.claude-plugin/marketplace.json and .codex-plugin/plugin.json).
type: object
required:
  - id
  - version
  - description
  - license
  - requires_bundles
  - surfaces
  - verification
properties:
  id:
    type: string
    description: Plugin identifier — must match the registry entry and the directory name
    pattern: "^[a-z][a-z0-9-]*$"
  version:
    type: string
    description: SemVer plugin version
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[a-zA-Z-][a-zA-Z0-9-]*)(\.((0|[1-9][0-9]*)|[0-9]*[a-zA-Z-][a-zA-Z0-9-]*))*)?(\+[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*)?$'
  description:
    type: string
    minLength: 10
  license:
    type: string
    description: SPDX license identifier (e.g. MIT, Apache-2.0)
  authors:
    type: array
    items: { type: string }
  extends:
    type: string
    description: |
      Optional upstream provenance reference (e.g. "official:pr-review-toolkit@1.2.0").
      G8 validates syntax and preserves metadata but performs no network resolution or behavior layering.
    pattern: "^(official|community):[a-z][a-z0-9-]*@[0-9]+\\.[0-9]+\\.[0-9]+$|^$"
  requires_bundles:
    type: array
    description: MCP bundles this plugin depends on
    items:
      type: string
      enum: [core, extended, enterprise]
  surfaces:
    type: object
    minProperties: 1
    additionalProperties: false
    description: |
      Map of surface type to relative paths inside the plugin directory.
      Surfaces are emitted to per-vendor plugin directories during compile.
    properties:
      skills:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, description: "Path to a SKILL.md file" }
      hooks:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, description: "Path to a hook registry fragment" }
      commands:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, description: "Path to a slash command definition" }
      agents:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, description: "Path to an agent yaml extending base" }
      mcp:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, description: "Path to an extra MCP server config" }
  verification:
    type: object
    additionalProperties: false
    properties:
      conformance_tests:
        type: string
        description: Path to plugin conformance test directory
additionalProperties: false
