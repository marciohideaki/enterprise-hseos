name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HSEOS_GOVERNANCE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Bind the selected Node runtime for legacy executor commands
        run: |
          selected_node="$(command -v node)"
          sudo install -m 0755 "$selected_node" /usr/bin/node
          test "$(sha256sum "$selected_node" | cut -d ' ' -f 1)" = "$(sha256sum /usr/bin/node | cut -d ' ' -f 1)"
      - name: Install isolation backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Tests and critical coverage in a delegated cgroup
        run: |
          sudo systemd-run --wait --collect --pipe --service-type=exec \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --property=DelegateSubgroup=tests \
            --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv=CI=true \
            --setenv="HSEOS_GOVERNANCE_TEST_DATABASE_URL=$HSEOS_GOVERNANCE_TEST_DATABASE_URL" \
            bash -c 'node .github/scripts/enable-test-cgroup.mjs && npm test && npm run test:kernel-coverage'

  governance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-hygiene gate can scan the PR range
          # (origin/<base>..HEAD) in addition to the HEAD commit message.
          fetch-depth: 0
      - run: npm ci
      # Server-side enforcement of the HSEOS governance gates (ADR-0015 Gate 7
      # included). The local .husky/pre-commit hook is bypassable with
      # --no-verify; this job is the non-bypassable PR-time enforcement point
      # and a required status check on master. The `ci` phase adds the
      # tracked-tree secret scan and commit-message hygiene on top of the doc
      # gates (gate_code is covered by the `test` job).
      - name: HSEOS governance quality gates
        run: VALIDATION_ENFORCED=true bash scripts/governance/quality-gates.sh --phase ci
