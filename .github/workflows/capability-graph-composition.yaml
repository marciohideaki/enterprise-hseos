name: capability-graph-composition

on:
  # No `paths` filter: `compose` is a required status check on master, and a path-filtered
  # workflow never reports on PRs that miss the paths, leaving them BLOCKED forever.
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) on every checkout: the initial-Contract rule proves an
      # ID was absent from the immediate PARENT of the authoritative revision -- a shallow
      # (depth-1) checkout has no parent commit to prove that against, and the validator fails
      # closed rather than silently deepening the fetch on a security-relevant code path.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Cross-org checkouts need a PAT with read access to these repositories -- the default
      # GITHUB_TOKEN cannot see outside this repository. CAPABILITY_GRAPH_CROSS_REPO_PAT is
      # provisioned from pass (github/cambioreal-gitops-pat), verified 2026-09-05 to read all
      # three repositories below.
      #
      # Org names updated 2026-09-16: platform-core and backend-core were TRANSFERRED out of
      # `HideakiSolutions` into `Hideaki-Solutions-Core`. These checkouts kept working on the
      # old names only because git follows the transfer redirect -- the pinned SHAs resolve
      # either way. That is a redirect, not an address: it disappears if a new repository is
      # ever created under the old name, and at that point this job would silently check out
      # the wrong tree on a security-relevant code path instead of failing. Pinned by SHA and
      # verified against the destination on 2026-09-16 (both SHAs present).
      #
      # Moved again 2026-10-06: platform-core and backend-core are now under `HideakiSolutions`
      # (back from `Hideaki-Solutions-Core`). Both pinned SHAs were verified present at the new
      # location on 2026-10-06; the old name stays a redirect only, not an address.
      - uses: actions/checkout@v4
        with:
          repository: HideakiSolutions/platform-core
          ref: e8ee6902cf14e2d46a89f1dc0294f751decccc2a
          path: dependencies/platform-core
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      # The immutable backend source includes current provider projections and a
      # retired JVM identity backed by historical Git evidence, without local SDK claims.
      - uses: actions/checkout@v4
        with:
          repository: HideakiSolutions/backend-core
          ref: b886d8ba7ef98ee371ebe4e8f76dce8727e9413c
          path: dependencies/backend-core
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      # cambio-real-v2's original pin (2124528f...) is unreachable as of 2026-09-05, matching
      # the gap already on record from 2026-08-27. Repinned to current main HEAD; same caveat
      # as backend-core above applies.
      - uses: actions/checkout@v4
        with:
          repository: cambioreal/cambio-real-v2
          ref: c826f6babc9d0be01ad7347473228a214eb90620
          path: dependencies/cambio-real-v2
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      # Talent Forge entra na federacao em 2026-09-18. Os dois repositorios sao privados na
      # organizacao Talent-Forge: o CAPABILITY_GRAPH_CROSS_REPO_PAT precisa de leitura nela,
      # o que NAO estava no escopo verificado em 2026-09-05 (tres repositorios apenas).
      - uses: actions/checkout@v4
        with:
          repository: Talent-Forge/talent-forge-platform
          ref: bc64abc1653cec5ae952d81de1315b6242b9a904
          path: dependencies/talent-forge-platform
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: Talent-Forge/talent-forge-web
          ref: b3fec078cc3c5a2ede091e44e27035e79e74b92f
          path: dependencies/talent-forge-web
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      # The canonical ECP fragment is required by the registry and must participate
      # in the same fail-closed composition as every other immutable dependency.
      - uses: actions/checkout@v4
        with:
          repository: HideakiSolutions/enterprise-capability-platform
          ref: ca8d8fa59168f1bf76f56b2559cab1720a911d86
          path: dependencies/enterprise-capability-platform
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      # One app-owned consumer record, with immutable local normal-app evidence.
      - uses: actions/checkout@v4
        with:
          repository: Hideaki-Solutions-Core/reference-banking-web
          ref: d9f35562006e8baf259afff33990497c2c7428ec
          path: dependencies/reference-banking-web
          fetch-depth: 0
          token: ${{ secrets.CAPABILITY_GRAPH_CROSS_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compose every immutable fragment (fail closed)
        run: >-
          node scripts/governance/validate-capability-graph.js
          --require-all-fragments
          --repository-root repo.platform-core=${{ github.workspace }}/dependencies/platform-core
          --repository-root repo.backend-core=${{ github.workspace }}/dependencies/backend-core
          --repository-root repo.cambio-real-v2=${{ github.workspace }}/dependencies/cambio-real-v2
          --repository-root repo.talent-forge-platform=${{ github.workspace }}/dependencies/talent-forge-platform
          --repository-root repo.talent-forge-web=${{ github.workspace }}/dependencies/talent-forge-web
          --repository-root repo.enterprise-capability-platform=${{ github.workspace }}/dependencies/enterprise-capability-platform
          --repository-root repo.reference-banking-web=${{ github.workspace }}/dependencies/reference-banking-web
          --json
