name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install isolation backend
        run: |
          # Network step: up to 3 attempts with 10 s then 30 s of backoff; a persistent failure still fails the step.
          net_retry() {
            for delay in 10 30 0; do
              "$@" && return 0
              [ "$delay" -gt 0 ] || break
              echo "retrying in ${delay}s: $*"
              sleep "$delay"
            done
            return 1
          }
          net_retry sudo apt-get update -qq
          net_retry sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Build immutable release artifact
        run: |
          release_version="$(node -p "require('./package.json').version")"
          mkdir -p dist release-smoke
          npm pack --pack-destination dist
          npm sbom --sbom-format cyclonedx > "dist/hseos-${release_version}.cdx.json"
          (
            cd dist
            sha256sum \
              "hseos-${release_version}.tgz" \
              "hseos-${release_version}.cdx.json" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          npm install --prefix release-smoke "${GITHUB_WORKSPACE}/dist/hseos-${release_version}.tgz"
          "${GITHUB_WORKSPACE}/release-smoke/node_modules/.bin/hseos" --help
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/hseos-*.tgz \
            dist/hseos-*.cdx.json \
            dist/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
