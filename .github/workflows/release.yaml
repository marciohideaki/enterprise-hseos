name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install isolation backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Build immutable release artifact
        run: |
          release_version="$(node -p "require('./package.json').version")"
          mkdir -p dist release-smoke
          npm pack --pack-destination dist
          npm sbom --sbom-format cyclonedx > "dist/hseos-${release_version}.cdx.json"
          sha256sum \
            "dist/hseos-${release_version}.tgz" \
            "dist/hseos-${release_version}.cdx.json" > dist/SHA256SUMS
          npm install --prefix release-smoke "${GITHUB_WORKSPACE}/dist/hseos-${release_version}.tgz"
          "${GITHUB_WORKSPACE}/release-smoke/node_modules/.bin/hseos" --help
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/hseos-*.tgz \
            dist/hseos-*.cdx.json \
            dist/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes-file docs/releases/v3.0.0.md
