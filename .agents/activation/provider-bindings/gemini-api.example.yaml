# Binding da quarta família (ADR-0050): API Gemini direta, pelo adapter openai-compatible-sse existente.
# Exemplo: nada aqui é fato verificado. O endpoint compatível e o modelo são configuração
# "a confirmar na campanha"; o host reservado .invalid impede egress acidental até lá.
# A cota e o saldo não são observáveis: a campanha só roda com quota_exceptions auditada e válida (ADR-0050 §1 L2).
# A credencial vem de env:// (chave própria no pass, grupo google/); o valor nunca entra neste arquivo.
# A origem para a qual a credencial pode ser enviada é fixada na configuração da campanha (allowed_origin, preso ao
# digest do binding), com valor "a confirmar na campanha"; o adapter recusa qualquer outra origem.
# Quem autoriza é o owner, por campanha: operational e authorized permanecem false.
schema_version: "1.0"
binding_id: provider-binding:gemini-api-example
profile_id: agent-openai-compatible-candidate
adapter: openai-compatible-sse
provider:
  provider_id: model:openai-compatible
  provider_version: 1.0.0
  # a confirmar na campanha: endpoint compatível com chat completions da API Gemini
  base_url: https://gemini-endpoint-a-confirmar.example.invalid/v1
  # a confirmar na campanha: identificador do modelo
  model: a-confirmar-na-campanha
  capabilities:
    - text_generation
    - streaming
    - tool_calls
    - usage
    - cancellation
  limits:
    context_tokens: 32768
    max_output_tokens: 4096
    max_parallel_requests: 1
  secret_refs:
    - name: api-key
      source_ref: env://HSEOS_GEMINI_API_KEY
transport:
  max_attempts: 1
  retry_delay_ms: 0
activation:
  operational: false
  authorized: false
