- id: model
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: deepseek-chat

- id: agent
  name: "@deepseek-ai/dsh-acp-demo"
  config:
    provider: deepseek-official
    model: deepseek-chat
    persistenceRoot: ./.hseos-deepseek-sessions
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: Answer with text only. Do not request or perform tools or external effects.
